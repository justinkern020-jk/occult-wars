<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <!-- Twin emeralds in shared gold inlay — Resource +2 -->
  <defs>
    <linearGradient id="dGoldRim" x1="8" y1="6" x2="120" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8e0"/>
      <stop offset=".18" stop-color="#f0d78a"/>
      <stop offset=".42" stop-color="#c6a15b"/>
      <stop offset=".72" stop-color="#8c6d32"/>
      <stop offset="1" stop-color="#4a3418"/>
    </linearGradient>
    <linearGradient id="dGoldFace" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a2a14"/>
      <stop offset=".35" stop-color="#1a120c"/>
      <stop offset=".7" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#140e08"/>
    </linearGradient>
    <radialGradient id="dEm" cx="42%" cy="36%" r="62%" gradientUnits="objectBoundingBox">
      <stop stop-color="#d8ffe8"/>
      <stop offset=".15" stop-color="#7dffb0"/>
      <stop offset=".4" stop-color="#1ecf6a"/>
      <stop offset=".7" stop-color="#0a8f48"/>
      <stop offset="1" stop-color="#012818"/>
    </radialGradient>
    <linearGradient id="dFacet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0fff6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0a8f48" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dAura" cx="64" cy="64" r="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5dffb0" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#0a8f48" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0a8f48" stop-opacity="0"/>
    </radialGradient>
    <filter id="dSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020805" flood-opacity=".75"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#dAura)"/>
  <circle cx="64" cy="64" r="61" stroke="url(#dGoldRim)" stroke-width="2.2" opacity=".55"/>
  <circle cx="64" cy="64" r="56.5" stroke="#fff4d6" stroke-width=".7" opacity=".22" stroke-dasharray="3 4"/>

  <g filter="url(#dSoft)">
    <path d="M64 10 L102 26 L118 64 L102 102 L64 118 L26 102 L10 64 L26 26 Z"
          fill="url(#dGoldFace)" stroke="url(#dGoldRim)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M64 18 L96 30 L110 64 L96 98 L64 110 L32 98 L18 64 L32 30 Z"
          fill="none" stroke="#fff4d6" stroke-width="1.1" opacity=".4"/>
    <path d="M64 22 L92 33 L104 64 L92 95 L64 106 L36 95 L24 64 L36 33 Z"
          fill="#0c1810" fill-opacity=".55" stroke="#c6a15b" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- left emerald -->
    <g transform="translate(-18,0)">
      <path d="M64 34 L82 50 L82 74 L64 90 L46 74 L46 50 Z" fill="url(#dEm)" stroke="#02301c" stroke-width="1"/>
      <path d="M64 42 L74 52 L64 55 L54 52 Z" fill="url(#dFacet)"/>
      <path d="M64 34 L74 52 L64 55 Z" fill="#e8fff2" fill-opacity=".25"/>
      <path d="M64 34 L54 52 L64 55 Z" fill="#046034" fill-opacity=".35"/>
      <path d="M46 74 L64 55 L82 74 L64 90 Z" fill="#00140c" fill-opacity=".4"/>
      <circle cx="56" cy="46" r="2.2" fill="#f5fff9" opacity=".95"/>
    </g>
    <!-- right emerald -->
    <g transform="translate(18,0)">
      <path d="M64 34 L82 50 L82 74 L64 90 L46 74 L46 50 Z" fill="url(#dEm)" stroke="#02301c" stroke-width="1"/>
      <path d="M64 42 L74 52 L64 55 L54 52 Z" fill="url(#dFacet)"/>
      <path d="M64 34 L74 52 L64 55 Z" fill="#e8fff2" fill-opacity=".25"/>
      <path d="M64 34 L54 52 L64 55 Z" fill="#046034" fill-opacity=".35"/>
      <path d="M46 74 L64 55 L82 74 L64 90 Z" fill="#00140c" fill-opacity=".4"/>
      <circle cx="56" cy="46" r="2.2" fill="#f5fff9" opacity=".9"/>
    </g>

    <!-- II seal between gems -->
    <g font-family="Cinzel, Palatino, serif" font-size="14" font-weight="700" fill="#f0d78a" opacity=".85">
      <text x="64" y="68" text-anchor="middle" letter-spacing="1">II</text>
    </g>
    <circle cx="64" cy="64" r="9" fill="none" stroke="#c6a15b" stroke-width="1" opacity=".5"/>
  </g>
</svg>
