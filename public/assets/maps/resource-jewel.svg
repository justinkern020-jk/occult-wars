<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- occult ledger jewel: faceted gem in brass bezel -->
  <defs>
    <linearGradient id="brass" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4d6"/>
      <stop offset=".35" stop-color="#e7d7a4"/>
      <stop offset=".7" stop-color="#c6a15b"/>
      <stop offset="1" stop-color="#8c6d32"/>
    </linearGradient>
    <linearGradient id="gem" x1="22" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8e8"/>
      <stop offset=".22" stop-color="#f0d78a"/>
      <stop offset=".55" stop-color="#c6a15b"/>
      <stop offset=".82" stop-color="#6a4e22"/>
      <stop offset="1" stop-color="#3a2a14"/>
    </linearGradient>
    <linearGradient id="facetHi" x1="24" y1="18" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe4aa" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#c6a15b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c6a15b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#0c0907" flood-opacity=".6"/>
    </filter>
  </defs>
  <!-- soft aura -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <!-- outer seal ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#brass)" stroke-width="1.4" opacity=".5"/>
  <circle cx="32" cy="32" r="26.5" stroke="#e7d7a4" stroke-width=".55" opacity=".28" stroke-dasharray="2 3"/>
  <g filter="url(#soft)">
    <!-- brass bezel (octagon-ish) -->
    <path d="M32 10 L48 18 L54 34 L48 50 L32 58 L16 50 L10 34 L16 18 Z"
          fill="#140f0c" fill-opacity=".45" stroke="url(#brass)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32 14 L45 20 L50 34 L45 48 L32 54 L19 48 L14 34 L19 20 Z"
          fill="none" stroke="#fff4d6" stroke-width=".7" opacity=".35"/>
    <!-- main gem (brilliant cut) -->
    <path d="M32 16 L46 28 L32 52 L18 28 Z" fill="url(#gem)" stroke="#3a2a16" stroke-width=".6"/>
    <!-- table facet -->
    <path d="M32 20 L40 28 L32 30 L24 28 Z" fill="url(#facetHi)"/>
    <!-- pavilion lines -->
    <path d="M32 30 L46 28 L32 52 L18 28 Z" fill="none" stroke="#fff4d6" stroke-width=".55" opacity=".35"/>
    <path d="M24 28 L32 52 L40 28" stroke="#1a120c" stroke-width=".55" opacity=".35"/>
    <!-- crown facets -->
    <path d="M32 16 L40 28 L32 30 Z" fill="#fff8e0" fill-opacity=".22"/>
    <path d="M32 16 L24 28 L32 30 Z" fill="#8c6d32" fill-opacity=".25"/>
    <!-- spark highlight -->
    <circle cx="28" cy="24" r="1.6" fill="#fffaf0" opacity=".9"/>
    <path d="M28 21.2 V22.6 M26.4 24 H27.8" stroke="#fffaf0" stroke-width=".7" stroke-linecap="round" opacity=".75"/>
  </g>
</svg>
