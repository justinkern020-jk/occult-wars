<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <!-- Lush emerald set in ornate gold/brass inlay — fills the tile face -->
  <defs>
    <linearGradient id="goldRim" x1="8" y1="6" x2="120" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8e0"/>
      <stop offset=".18" stop-color="#f0d78a"/>
      <stop offset=".42" stop-color="#c6a15b"/>
      <stop offset=".72" stop-color="#8c6d32"/>
      <stop offset="1" stop-color="#4a3418"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a2a14"/>
      <stop offset=".35" stop-color="#1a120c"/>
      <stop offset=".7" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#140e08"/>
    </linearGradient>
    <radialGradient id="emeraldBody" cx="48%" cy="38%" r="58%" gradientUnits="objectBoundingBox">
      <stop stop-color="#d8ffe8"/>
      <stop offset=".12" stop-color="#7dffb0"/>
      <stop offset=".32" stop-color="#1ecf6a"/>
      <stop offset=".55" stop-color="#0a8f48"/>
      <stop offset=".78" stop-color="#046034"/>
      <stop offset="1" stop-color="#012818"/>
    </radialGradient>
    <linearGradient id="emeraldFacetHi" x1="40" y1="28" x2="78" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0fff6" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#a8f5c8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0a8f48" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="emeraldDeep" x1="70" y1="50" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#012818" stop-opacity="0"/>
      <stop offset="1" stop-color="#00140c" stop-opacity=".65"/>
    </linearGradient>
    <radialGradient id="aura" cx="64" cy="64" r="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3dff9a" stop-opacity=".45"/>
      <stop offset=".4" stop-color="#0a8f48" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0a8f48" stop-opacity="0"/>
    </radialGradient>
    <filter id="gemSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#020805" flood-opacity=".75"/>
    </filter>
  </defs>

  <!-- soft emerald aura -->
  <circle cx="64" cy="64" r="60" fill="url(#aura)"/>

  <!-- outer occult seal ring -->
  <circle cx="64" cy="64" r="61" stroke="url(#goldRim)" stroke-width="2.2" opacity=".55"/>
  <circle cx="64" cy="64" r="56.5" stroke="#fff4d6" stroke-width=".7" opacity=".22" stroke-dasharray="3 4"/>

  <!-- ornate gold inlay plate (octagon) -->
  <g filter="url(#gemSoft)">
    <path d="M64 10 L102 26 L118 64 L102 102 L64 118 L26 102 L10 64 L26 26 Z"
          fill="url(#goldFace)" stroke="url(#goldRim)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- inner brass lip -->
    <path d="M64 18 L96 30 L110 64 L96 98 L64 110 L32 98 L18 64 L32 30 Z"
          fill="none" stroke="#fff4d6" stroke-width="1.1" opacity=".4"/>
    <path d="M64 22 L92 33 L104 64 L92 95 L64 106 L36 95 L24 64 L36 33 Z"
          fill="#0c1810" fill-opacity=".55" stroke="#c6a15b" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- corner filigree ticks -->
    <path d="M64 14 L68 22 L64 20 L60 22 Z" fill="#f0d78a" opacity=".7"/>
    <path d="M114 64 L106 68 L108 64 L106 60 Z" fill="#f0d78a" opacity=".55"/>
    <path d="M64 114 L60 106 L64 108 L68 106 Z" fill="#8c6d32" opacity=".7"/>
    <path d="M14 64 L22 60 L20 64 L22 68 Z" fill="#8c6d32" opacity=".55"/>

    <!-- main emerald — brilliant / step-cut hybrid filling the bezel -->
    <path d="M64 28 L92 48 L92 80 L64 100 L36 80 L36 48 Z"
          fill="url(#emeraldBody)" stroke="#02301c" stroke-width="1.2"/>
    <!-- table -->
    <path d="M64 40 L78 52 L64 56 L50 52 Z" fill="url(#emeraldFacetHi)"/>
    <!-- crown facets -->
    <path d="M64 28 L78 52 L64 56 Z" fill="#e8fff2" fill-opacity=".28"/>
    <path d="M64 28 L50 52 L64 56 Z" fill="#046034" fill-opacity=".35"/>
    <path d="M92 48 L78 52 L64 56 L92 80 Z" fill="#7dffb0" fill-opacity=".12"/>
    <path d="M36 48 L50 52 L64 56 L36 80 Z" fill="#012818" fill-opacity=".28"/>
    <!-- pavilion -->
    <path d="M64 56 L92 80 L64 100 L36 80 Z" fill="url(#emeraldDeep)"/>
    <path d="M50 52 L64 100 L78 52" stroke="#012818" stroke-width=".8" opacity=".35"/>
    <path d="M36 48 L64 56 L92 48" stroke="#d8ffe8" stroke-width=".65" opacity=".25"/>
    <path d="M36 80 L64 56 L92 80" stroke="#012818" stroke-width=".7" opacity=".3"/>
    <!-- sparkle -->
    <circle cx="52" cy="44" r="3.2" fill="#f5fff9" opacity=".95"/>
    <path d="M52 38.5 V41.2 M48.8 44 H51.5" stroke="#f5fff9" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
    <circle cx="72" cy="70" r="1.4" fill="#a8f5c8" opacity=".55"/>
  </g>
</svg>
