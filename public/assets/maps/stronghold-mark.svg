<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- occult brass castle / stronghold seal -->
  <defs>
    <linearGradient id="brass" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4d6"/>
      <stop offset=".35" stop-color="#e7d7a4"/>
      <stop offset=".7" stop-color="#c6a15b"/>
      <stop offset="1" stop-color="#8c6d32"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0c0907" flood-opacity=".55"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" stroke="url(#brass)" stroke-width="1.5" opacity=".5"/>
  <circle cx="32" cy="32" r="26.5" stroke="#e7d7a4" stroke-width=".55" opacity=".3" stroke-dasharray="2 3"/>
  <g filter="url(#soft)" stroke="url(#brass)" stroke-linejoin="round" stroke-linecap="round">
    <!-- curtain wall -->
    <path d="M14 46 V28 H20 V22 H26 V28 H38 V22 H44 V28 H50 V46 Z" fill="#0c0907" fill-opacity=".35" stroke-width="2.4"/>
    <!-- battlements -->
    <path d="M14 28 H20 M26 28 H38 M44 28 H50" stroke-width="2.2"/>
    <path d="M20 22 V16 H26 V22 M38 22 V16 H44 V22" stroke-width="2.2"/>
    <!-- keep tower -->
    <path d="M28 46 V20 H36 V46" fill="#140f0c" fill-opacity=".5" stroke-width="2.2"/>
    <path d="M26 20 H38" stroke-width="2"/>
    <!-- keep crenellations -->
    <path d="M28 16 H31 V20 M33 16 H36 V20" stroke-width="2"/>
    <!-- gate arch in keep -->
    <path d="M30 46 V40 C30 37 34 37 34 40 V46" stroke-width="1.6" fill="none"/>
    <!-- threshold -->
    <path d="M12 46 H52" stroke-width="2.2"/>
    <path d="M14 49 H50" stroke="#8c6d32" stroke-width="1" opacity=".75"/>
    <!-- brass eye / lamp over gate -->
    <circle cx="32" cy="34" r="2.4" fill="#fff4d6" stroke="none" opacity=".95"/>
    <circle cx="32" cy="34" r="1.1" fill="#3a2a16" stroke="none"/>
  </g>
</svg>
